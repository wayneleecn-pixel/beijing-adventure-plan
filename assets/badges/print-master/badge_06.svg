  <!-- Layer 3: Central Subject Vector Art -->

  <!-- Flanking Laurel Wreath Branches (Left & Right Green Leaves) -->
  <!-- Left Laurel Branch -->
  <g fill="#2E7D47">
    <path d="M 140,285 Q 120,230 140,165 Q 125,230 140,285" fill="#2E7D47"/>
    <ellipse cx="128" cy="180" rx="12" ry="7" transform="rotate(-35 128 180)"/>
    <ellipse cx="120" cy="210" rx="13" ry="8" transform="rotate(-15 120 210)"/>
    <ellipse cx="122" cy="240" rx="13" ry="8" transform="rotate(10 122 240)"/>
    <ellipse cx="132" cy="270" rx="12" ry="7" transform="rotate(30 132 270)"/>
  </g>

  <!-- Right Laurel Branch -->
  <g fill="#2E7D47">
    <path d="M 310,285 Q 330,230 310,165 Q 325,230 310,285" fill="#2E7D47"/>
    <ellipse cx="322" cy="180" rx="12" ry="7" transform="rotate(35 322 180)"/>
    <ellipse cx="330" cy="210" rx="13" ry="8" transform="rotate(15 330 210)"/>
    <ellipse cx="328" cy="240" rx="13" ry="8" transform="rotate(-10 328 240)"/>
    <ellipse cx="318" cy="270" rx="12" ry="7" transform="rotate(-30 318 270)"/>
  </g>

  <!-- Compass Rose Outer Dial Ring -->
  <circle cx="225" cy="215" r="75" fill="none" stroke="#7A3E20" stroke-width="12"/>

  <!-- 8-Pointed Faceted Starburst Compass Rose (Gold & Brown bevels) -->
  <!-- North Point -->
  <polygon points="225,120 225,215 210,215" fill="#E5A823"/>
  <polygon points="225,120 225,215 240,215" fill="#7A3E20"/>

  <!-- South Point -->
  <polygon points="225,310 225,215 240,215" fill="#E5A823"/>
  <polygon points="225,310 225,215 210,215" fill="#7A3E20"/>

  <!-- East Point -->
  <polygon points="320,215 225,215 225,200" fill="#E5A823"/>
  <polygon points="320,215 225,215 225,230" fill="#7A3E20"/>

  <!-- West Point -->
  <polygon points="130,215 225,215 225,230" fill="#E5A823"/>
  <polygon points="130,215 225,215 225,200" fill="#7A3E20"/>

  <!-- 4 Minor Diagonal Points (NE, NW, SE, SW) -->
  <polygon points="280,160 225,215 233,207" fill="#E5A823"/>
  <polygon points="280,160 225,215 225,215" fill="#7A3E20"/>
  <polygon points="170,160 225,215 217,207" fill="#7A3E20"/>
  <polygon points="170,160 225,215 225,215" fill="#E5A823"/>
  <polygon points="280,270 225,215 233,223" fill="#7A3E20"/>
  <polygon points="280,270 225,215 225,215" fill="#E5A823"/>
  <polygon points="170,270 225,215 217,223" fill="#E5A823"/>
  <polygon points="170,270 225,215 225,215" fill="#7A3E20"/>

  <!-- Central Hub Medallion -->
  <circle cx="225" cy="215" r="18" fill="#E5A823"/>
  <circle cx="225" cy="215" r="10" fill="#7A3E20"/>

  <!-- North Crowning Star -->
  <polygon points="225,92 229,102 240,102 231,108 234,118 225,112 216,118 219,108 210,102 221,102" fill="#E5A823"/>


  <!-- Layer 4: Bottom Folded Ribbon Banner -->

  <!-- Ribbon Left Fold Wing -->
  <polygon points="125,335 80,335 98,365 72,395 125,375" fill="#2E7D47"/>
  <polygon points="125,355 125,375 140,355" fill="#7A3E20"/>

  <!-- Ribbon Right Fold Wing -->
  <polygon points="325,335 370,335 352,365 378,395 325,375" fill="#2E7D47"/>
  <polygon points="325,355 325,375 310,355" fill="#7A3E20"/>

  <!-- Ribbon Main Center Banner -->
  <path d="M 120,330 Q 225,342 330,330 L 330,375 Q 225,392 120,375 Z" fill="#2E7D47"/>

</svg>