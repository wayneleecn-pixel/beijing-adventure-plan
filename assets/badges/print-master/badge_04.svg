        fill="none" stroke="#7A3E20" stroke-width="26" stroke-linecap="round"/>
  <!-- Film Sprocket Holes (Cutout Blue, each >= 1.2mm) -->
  <circle cx="120" cy="140" r="5" fill="#3B82C8"/>
  <circle cx="150" cy="115" r="5" fill="#3B82C8"/>
  <circle cx="185" cy="102" r="5" fill="#3B82C8"/>
  <circle cx="225" cy="100" r="5" fill="#3B82C8"/>
  <circle cx="265" cy="105" r="5" fill="#3B82C8"/>
  <circle cx="305" cy="122" r="5" fill="#3B82C8"/>
  <circle cx="335" cy="155" r="5" fill="#3B82C8"/>
  <circle cx="345" cy="195" r="5" fill="#3B82C8"/>
  <circle cx="335" cy="235" r="5" fill="#3B82C8"/>

  <!-- Main Clapperboard Body (Solid Warm Brown) -->
  <rect x="155" y="195" width="140" height="90" rx="6" fill="#7A3E20"/>

  <!-- Clapperboard Top Plate (Diagonal stripes) -->
  <rect x="155" y="195" width="140" height="24" rx="2" fill="#E5A823"/>
  <polygon points="175,195 190,195 170,219 155,219" fill="#7A3E20"/>
  <polygon points="215,195 230,195 210,219 195,219" fill="#7A3E20"/>
  <polygon points="255,195 270,195 250,219 235,219" fill="#7A3E20"/>

  <!-- Clapperboard Open Top Stick (Angled ~22 deg) -->
