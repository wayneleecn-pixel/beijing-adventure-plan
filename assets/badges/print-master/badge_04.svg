    <rect x="155" y="171" width="140" height="24" rx="2" fill="#E5A823"/>
    <polygon points="175,171 190,171 170,195 155,195" fill="#7A3E20"/>
    <polygon points="215,171 230,171 210,195 195,195" fill="#7A3E20"/>
    <polygon points="255,171 270,171 250,195 235,195" fill="#7A3E20"/>
  </g>

  <!-- Big Bold Adventure Star (Left) -->
  <polygon points="125,210 132,228 150,228 136,240 141,258 125,246 109,258 114,240 100,228 118,228" fill="#E5A823"/>


  <!-- Layer 4: Bottom Folded Ribbon Banner -->

  <!-- Ribbon Left Fold Wing -->
